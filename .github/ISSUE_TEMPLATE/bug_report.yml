name: Bug report
description: Report a reproducible MediaDock problem without sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Cookies, passwords, verification codes, private URLs,
        or complete home-directory paths. Remove all sensitive values first.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.1"
    validations:
      required: true
  - type: input
    id: mediadock
    attributes:
      label: MediaDock version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a sanitized example and describe what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only the relevant error text after removing private data.
